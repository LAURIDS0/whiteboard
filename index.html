<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Whiteboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/board.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/tools.css">
  <link rel="stylesheet" href="css/dialog.css">
  <link rel="stylesheet" href="css/responsive.css">
  <script src="js/state.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/canvas.js" defer></script>
  <script src="js/notes.js" defer></script>
  <script src="js/objects.js" defer></script>
  <script src="js/history.js" defer></script>
  <script src="js/export.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <main class="whiteboard-shell">
    <div class="whiteboard" id="whiteboard">
      <canvas id="whiteboard-canvas" aria-label="Whiteboard canvas"></canvas>
      <div id="object-layer" aria-live="polite"></div>
    </div>
  </main>

  <div class="options-panel" id="options-panel" aria-live="polite">
    <section class="options" data-panel="wall">
      <button type="button" class="option active" data-option="select"><i class="fa-solid fa-up-down-left-right"></i>Flyt</button>
      <button type="button" class="option" data-option="rotate" data-requires-selection><i class="fa-solid fa-rotate"></i>Roter</button>
      <button type="button" class="option" data-option="resize" data-requires-selection><i class="fa-solid fa-up-right-and-down-left-from-center"></i>Størrelse</button>
      <button type="button" class="option" data-option="duplicate" data-requires-selection><i class="fa-regular fa-copy"></i>Duplikér</button>
      <button type="button" class="option" data-control="object-opacity" data-requires-selection><i class="fa-solid fa-eye"></i>Gennemsigtighed</button>
    </section>

    <section class="options" data-panel="pen">
      <button type="button" class="option active" data-option="pencil"><i class="fa-solid fa-pencil"></i>Blyant</button>
      <button type="button" class="option" data-option="brush"><i class="fa-solid fa-paintbrush"></i>Pensel</button>
      <button type="button" class="option" data-option="marker"><i class="fa-solid fa-highlighter"></i>Markør</button>
      <button type="button" class="option" data-control="pen-thickness"><i class="fa-solid fa-arrows-left-right"></i>Tykkelse</button>
      <button type="button" class="option" data-control="pen-opacity"><i class="fa-solid fa-eye"></i>Gennemsigtighed</button>
      <button type="button" class="option" data-action="shapes"><i class="fa-solid fa-shapes"></i>Former</button>
    </section>

    <section class="options" data-panel="shapes">
      <button type="button" class="option active" data-option="rectangle"><i class="fa-regular fa-square"></i>Rektangel</button>
      <button type="button" class="option" data-option="circle"><i class="fa-regular fa-circle"></i>Cirkel</button>
      <button type="button" class="option" data-option="triangle"><i class="fa-solid fa-play"></i>Trekant</button>
      <button type="button" class="option" data-option="star"><i class="fa-solid fa-star"></i>Stjerne</button>
      <button type="button" class="option" data-control="shape-thickness"><i class="fa-solid fa-arrows-left-right"></i>Tykkelse</button>
    </section>

    <section class="options" data-panel="erase">
      <button type="button" class="option active" data-option="objects"><i class="fa-solid fa-object-group"></i>Objekter</button>
      <button type="button" class="option" data-option="lines"><i class="fa-solid fa-minus"></i>Linjer</button>
      <button type="button" class="option" data-option="images"><i class="fa-solid fa-image"></i>Billeder</button>
      <button type="button" class="option" data-control="eraser-size"><i class="fa-solid fa-arrows-left-right"></i>Viskelæderstørrelse</button>
    </section>

    <section class="options" data-panel="notes">
      <button type="button" class="option active" data-option="sticky"><i class="fa-solid fa-note-sticky"></i>Gul note</button>
      <button type="button" class="option" data-option="paper"><i class="fa-solid fa-file-lines"></i>Papirnote</button>
      <button type="button" class="option" data-option="checklist"><i class="fa-solid fa-list-check"></i>Tjekliste</button>
      <button type="button" class="option" data-option="text"><i class="fa-solid fa-align-left"></i>Tekstnote</button>
    </section>

    <section class="options" data-panel="images">
      <button type="button" class="option active" data-option="upload"><i class="fa-solid fa-upload"></i>Upload</button>
      <button type="button" class="option" data-option="url"><i class="fa-solid fa-link"></i>Adresse</button>
    </section>

    <section class="options" data-panel="line">
      <button type="button" class="option active" data-option="straight"><i class="fa-solid fa-minus"></i>Enkel</button>
      <button type="button" class="option" data-option="parallel"><i class="fa-solid fa-arrows-left-right-to-line"></i>Parallel</button>
      <button type="button" class="option" data-option="arrow"><i class="fa-solid fa-arrow-right"></i>Pil</button>
      <button type="button" class="option" data-option="dotted"><i class="fa-solid fa-ellipsis"></i>Prikket</button>
      <button type="button" class="option" data-control="line-thickness"><i class="fa-solid fa-arrows-left-right"></i>Tykkelse</button>
    </section>

    <section class="options" data-panel="layers">
      <button type="button" class="option active" data-layer-filter="notes"><i class="fa-solid fa-note-sticky"></i>Noter</button>
      <button type="button" class="option" data-layer-filter="images"><i class="fa-solid fa-image"></i>Billeder</button>
      <button type="button" class="option" data-option="front" data-requires-selection><i class="fa-solid fa-angles-up"></i>Frem</button>
      <button type="button" class="option" data-option="back" data-requires-selection><i class="fa-solid fa-angles-down"></i>Tilbage</button>
      <button type="button" class="option" data-action="layer-order"><i class="fa-solid fa-layer-group"></i>Lagorden</button>
    </section>
  </div>

  <div class="control-popover" id="control-popover" hidden>
    <div class="control-header">
      <strong id="control-title">Kontrol</strong>
      <button id="control-close" type="button" aria-label="Luk kontrol">&times;</button>
    </div>
    <label class="control-range-row" id="control-range-row">
      <input id="control-range" type="range">
      <output id="control-value"></output>
    </label>
  </div>

  <div class="color-popover" id="color-popover" hidden>
    <div class="color-popover-header">
      <strong>Farve</strong>
      <button id="color-close" type="button" aria-label="Luk farve">&times;</button>
    </div>
    <div class="color-picker-body">
      <button class="color-preview" id="color-preview" type="button" aria-label="Åbn farvevælger">
        <span id="color-preview-swatch"></span>
      </button>
      <div class="color-picker-copy">
        <strong id="color-value">#111827</strong>
        <span>Vælg farve til pen, linjer og former</span>
      </div>
      <input id="color-input" type="color" value="#111827" aria-label="Vælg farve">
    </div>
    <button class="color-pipette" id="color-pipette" type="button"><i class="fa-solid fa-eye-dropper"></i>Pipette</button>
  </div>

  <div class="dialog-backdrop" id="dialog-backdrop" hidden>
    <form class="dialog" id="input-dialog">
      <div class="dialog-header">
        <h2 id="dialog-title">Tilføj</h2>
        <button class="dialog-close" id="dialog-close" type="button" aria-label="Luk">&times;</button>
      </div>
      <label id="dialog-label" for="dialog-input">Tekst</label>
      <input id="dialog-input" autocomplete="off">
      <div class="dialog-actions">
        <button class="dialog-button secondary" id="dialog-cancel" type="button">Annuller</button>
        <button class="dialog-button primary" type="submit">Tilføj</button>
      </div>
    </form>
  </div>

  <div class="dialog-backdrop" id="confirm-backdrop" hidden>
    <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
      <div class="dialog-header">
        <h2 id="confirm-title">Bekræft</h2>
        <button class="dialog-close" id="confirm-close" type="button" aria-label="Luk">&times;</button>
      </div>
      <p class="dialog-message" id="confirm-message"></p>
      <div class="dialog-actions">
        <button class="dialog-button secondary" id="confirm-cancel" type="button">Annuller</button>
        <button class="dialog-button danger" id="confirm-submit" type="button">Bekræft</button>
      </div>
    </div>
  </div>

  <div class="layer-popover" id="layer-popover" hidden>
    <div class="layer-header">
      <strong>Lagorden</strong>
      <button id="layer-close" type="button" aria-label="Luk lagorden">&times;</button>
    </div>
    <div class="layer-list" id="layer-list"></div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <nav class="toolsbar" aria-label="Whiteboard værktøjer">
    <button type="button" class="tool" id="wall" data-tool="wall"><i class="fa-solid fa-border-all"></i>Væg</button>
    <button type="button" class="tool" id="pen" data-tool="pen"><i class="fa-solid fa-pen"></i>Pen</button>
    <button type="button" class="tool tool-color" id="color" data-tool="color" aria-label="Farve" title="Farve">
      <span class="tool-color-icon"><i class="fa-solid fa-palette"></i></span>
      <span>Farve</span>
      <span class="tool-color-swatch" id="color-tool-swatch"></span>
    </button>
    <button type="button" class="tool" id="erase" data-tool="erase"><i class="fa-solid fa-eraser"></i>Viskelæder</button>
    <button type="button" class="tool" id="notes" data-tool="notes"><i class="fa-solid fa-note-sticky"></i>Noter</button>
    <button type="button" class="tool" id="images" data-tool="images"><i class="fa-solid fa-image"></i>Billeder</button>
    <button type="button" class="tool" id="line" data-tool="line"><i class="fa-solid fa-minus"></i>Linje</button>
    <button type="button" class="tool" id="layers" data-tool="layers"><i class="fa-solid fa-layer-group"></i>Lag</button>
    <button type="button" class="tool" id="undo" data-tool="undo"><i class="fa-solid fa-rotate-left"></i>Fortryd</button>
    <button type="button" class="tool" id="redo" data-tool="redo"><i class="fa-solid fa-rotate-right"></i>Gendan</button>
    <button type="button" class="tool" id="clear" data-tool="clear"><i class="fa-solid fa-trash"></i>Ryd</button>
    <button type="button" class="tool" id="save" data-tool="save"><i class="fa-solid fa-download"></i>Gem</button>
  </nav>
</body>
</html>
